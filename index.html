    <style>
        :root {
            --primary: #58111A;
            --primary-light: #7A1C28;
            --bg: #FDFBF7;
            --card-bg: #FFFFFF;
            --text: #2C2C2C;
            --border: #E5E0D8;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 20px 20px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            border-top: 5px solid var(--primary);
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .tagline {
            font-style: italic;
            color: #666;
            margin-bottom: 20px;
        }

        .contacts {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .contact-card {
            font-size: 0.95rem;
        }

        .contact-card strong {
            color: var(--primary);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--primary);
        }

        .producer-section {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border);
        }

        .producer-title {
            color: var(--primary);
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            font-size: 1.5rem;
        }

        .category-header {
            background-color: var(--bg);
            color: var(--primary-light);
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
            padding: 8px 12px;
            margin: 15px 0 10px 0;
            border-left: 4px solid var(--primary);
            border-radius: 0 4px 4px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-weight: 600;
            color: #555;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        td.price {
            font-weight: 600;
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            display: none;
            font-size: 1.1rem;
            color: #777;
        }

        .pdf-download {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 18px;
            background: var(--primary);
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .pdf-download:hover,
        .pdf-download:focus-visible {
            background: var(--primary-light);
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            th, td { padding: 8px 6px; font-size: 0.85rem; }
            .contacts { gap: 15px; flex-direction: column; }
        }
    </style>
</head>

        function parseCSV(text) {
            const rows = [];
            let current = '';
            let row = [];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const next = text[i + 1];

                if (char === '"') {
                    if (inQuotes && next === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(current);
                    current = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && next === '\n') i++;
                    row.push(current);
                    if (row.some(cell => cell !== '')) {
                        rows.push(row);
                    }
                    row = [];
                    current = '';
                } else {
                    current += char;
                }
            }

            if (current.length || row.length) {
                row.push(current);
                if (row.some(cell => cell !== '')) {
                    rows.push(row);
                }
            }

            if (!rows.length) return [];

            const [header, ...dataRows] = rows;
            const cleanedHeader = header.map(h => h.trim());
            return dataRows.map(values => {
                const obj = {};
                cleanedHeader.forEach((key, index) => {
                    obj[key] = (values[index] || '').trim();
                });
                return obj;
            });
        }

        function buildCatalog() {
            const container = document.getElementById('menuContainer');
            const rows = parseCSV(csvText);
            const grouped = {};

            rows.forEach(row => {
                const producer = row.Producer || 'Unknown Producer';
                const type = row.Type || 'Other';
                if (!grouped[producer]) grouped[producer] = {};
                if (!grouped[producer][type]) grouped[producer][type] = [];
                grouped[producer][type].push(row);
            });

            const producers = Object.keys(grouped);
            producers.forEach(producer => {
                const producerSection = document.createElement('div');
                producerSection.className = 'producer-section';

                const title = document.createElement('h2');
                title.className = 'producer-title';
                title.textContent = producer;
                producerSection.appendChild(title);

                const types = Object.keys(grouped[producer]);
                types.forEach(type => {
                    const header = document.createElement('div');
                    header.className = 'category-header';
                    header.textContent = type.toUpperCase();
                    producerSection.appendChild(header);

                    const table = document.createElement('table');
                    const thead = document.createElement('thead');
                    const tr = document.createElement('tr');
                    ['SKU', 'Wine', 'Vintage', 'Bottle Price', 'Case Price'].forEach(label => {
                        const th = document.createElement('th');
                        th.textContent = label;
                        tr.appendChild(th);
                    });
                    thead.appendChild(tr);
                    table.appendChild(thead);

                    const tbody = document.createElement('tbody');
                    grouped[producer][type].forEach(item => {
                        const row = document.createElement('tr');
                        const fields = [
                            item.SKU,
                            item.Wine,
                            item.Vintage,
                            '$' + Number(item['Bottle Price']).toFixed(2),
                            '$' + Number(item['Case Price']).toFixed(2),
                        ];

                        fields.forEach((value, index) => {
                            const cell = document.createElement(index === 2 ? 'td' : index === 3 || index === 4 ? 'td' : 'td');
                            cell.textContent = value;
                            if (index === 3 || index === 4) cell.className = 'price';
                            row.appendChild(cell);
                        });

                        tbody.appendChild(row);
                    });

                    table.appendChild(tbody);
                    producerSection.appendChild(table);
                });

                container.appendChild(producerSection);
            });
        }

        function filterMenu() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const sections = document.querySelectorAll('.producer-section');
            let visibleSections = 0;

            sections.forEach(section => {
                const producerName = section.querySelector('.producer-title').textContent.toLowerCase();
                let visibleRowsInSection = 0;

                section.querySelectorAll('tbody tr').forEach(row => {
                    const rowText = row.textContent.toLowerCase();
                    const matches = rowText.includes(query) || producerName.includes(query);
                    row.style.display = matches ? '' : 'none';
                    if (matches) visibleRowsInSection++;
                });

                section.style.display = visibleRowsInSection > 0 ? '' : 'none';
                if (visibleRowsInSection > 0) visibleSections++;
            });

            const noResults = document.getElementById('noResults');
            if (noResults) {
                noResults.style.display = visibleSections === 0 ? 'block' : 'none';
            }
        }

        buildCatalog();
        document.getElementById('searchInput').addEventListener('input', filterMenu);
    </script>
