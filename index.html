<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rare Grape - Wine Price List</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #fdfbf7;
            color: #2c2c2c;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }
        .loading-message {
            max-width: 700px;
            margin: 48px auto;
            text-align: center;
            color: #58111a;
        }
        .pdf-download {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 18px;
            border-radius: 6px;
            background: #58111a;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }
        .pdf-download:hover,
        .pdf-download:focus-visible {
            background: #7a1c28;
        }
        .pdf-download:focus-visible {
            outline: 3px solid #cbaab0;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main class="loading-message" id="pageStatus" role="status">
        Loading the searchable wine pricing list…
    </main>

    <script>
        (async function loadWinePriceList() {
            const status = document.getElementById('pageStatus');
            const sourceUrl = 'https://raw.githubusercontent.com/theraregrape/Wine-Price-List-HTML/a0131e4057fe8e70eea9b5e798e7d6ee1598382b/index.html';

            try {
                const response = await fetch(sourceUrl);
                if (!response.ok) throw new Error('Could not load the pricing list.');

                const html = await response.text();
                const source = new DOMParser().parseFromString(html, 'text/html');
                const sourceStyles = source.querySelector('head style');
                const sourceContainer = source.querySelector('.container');

                if (!sourceStyles || !sourceContainer) {
                    throw new Error('The pricing list content was not found.');
                }

                // Reuse the previously published searchable catalog and its styling.
                const style = document.createElement('style');
                style.textContent = sourceStyles.textContent;
                document.head.appendChild(style);
                document.body.innerHTML = sourceContainer.outerHTML;

                // Keep the PDF link available alongside the searchable price list.
                const header = document.querySelector('.container header');
                const download = document.createElement('a');
                download.className = 'pdf-download';
                download.href = 'wine-price-list.pdf';
                download.download = '';
                download.textContent = 'Download Wine Price List (PDF)';
                download.setAttribute('aria-label', 'Download the wine price list as a PDF');
                header.appendChild(download);

                // Re-enable search on the restored catalog.
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', filterMenu);

                function filterMenu() {
                    const query = searchInput.value.toLowerCase();
                    const sections = document.querySelectorAll('.producer-section');
                    let visibleSections = 0;

                    sections.forEach(section => {
                        const producerName = section.querySelector('.producer-title').textContent.toLowerCase();
                        let visibleRows = 0;

                        section.querySelectorAll('tbody tr').forEach(row => {
                            const matches = row.textContent.toLowerCase().includes(query) || producerName.includes(query);
                            row.style.display = matches ? '' : 'none';
                            if (matches) visibleRows++;
                        });

                        section.style.display = visibleRows ? '' : 'none';
                        if (visibleRows) visibleSections++;
                    });

                    const noResults = document.getElementById('noResults');
                    if (noResults) noResults.style.display = visibleSections ? 'none' : 'block';
                }
            } catch (error) {
                status.innerHTML = '<strong>The searchable wine list could not be loaded.</strong><br>Please refresh the page or contact The Rare Grape.';
            }
        })();
    </script>
</body>
</html>
